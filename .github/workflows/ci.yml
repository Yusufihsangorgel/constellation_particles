name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Weekly, so SDK, dependency and runner-image drift shows up on its
  # own rather than waiting for the next push.
  schedule:
    - cron: '26 5 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [stable, minimum]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
        if: matrix.sdk == 'stable'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
        if: matrix.sdk == 'minimum'
      - name: Use Flutter 3.24 compatible analysis lints
        run: |
          cat > pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            flutter_lints: 5.0.0
          EOF
        if: matrix.sdk == 'minimum'
      - run: flutter pub get
      - run: dart analyze --fatal-infos
      - run: dart format --output=none --set-exit-if-changed .
        if: matrix.sdk == 'stable'
      - run: flutter test
      - run: flutter pub get && flutter test
        working-directory: example
      - run: dart run example/frame_cost.dart
