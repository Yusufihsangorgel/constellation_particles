name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Weekly, so SDK, dependency and runner-image drift shows up on its
  # own rather than waiting for the next push.
  schedule:
    - cron: '26 5 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart analyze --fatal-infos
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter test

      # example/README.md quotes this script's tables, so run it. It is a real
      # check rather than a smoke test: the script exits non-zero if the
      # every-pair and grid passes stop agreeing on how many lines they drew,
      # which is what halving the grid's cell size does.
      - run: dart run example/frame_cost.dart
